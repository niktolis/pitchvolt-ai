name: Promote verified IDSSE historical clip

# A single, feature-branch-only promotion: no source bytes are downloaded
# by the browser or production app. The licensed, compact source-derived
# clip is checked into THIS review PR only after its pinned digest passes.
on:
  push:
    branches:
      - feat/153-source-tracked-3d-replay
    paths:
      - .github/workflows/idsse-clip-promotion.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: idsse-clip-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'niktolis/pitchvolt-ai' && github.ref == 'refs/heads/feat/153-source-tracked-3d-replay'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch previously source-verified Actions artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Source-producing job verified the original DFL file SHA and clip schema.
          # This run ID and the resulting derived SHA are immutable review inputs.
          gh run download 39258654058 \
            --repo niktolis/pitchvolt-ai \
            --name idsse-j03wmx-25s-observed-clip-v1 \
            --dir "$RUNNER_TEMP/idsse-reviewed"
          SRC="$RUNNER_TEMP/idsse-reviewed/local-data/derived/j03wmx-shot-12519-observed-v1.json"
          test -f "$SRC"
          echo "d1b6dda14d84a266cd26ef607c12b62712fe906a8de9c9b75be860b464346db6  $SRC" | sha256sum --check --status
          test "$(wc -c < "$SRC" | tr -d ' ')" = "381441"
          mkdir -p web/public/historical
          cp "$SRC" web/public/historical/j03wmx-shot-12519-observed-v1.json
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from pitchvolt.idsse_clip_export import verify_compact_asset

          asset = Path("web/public/historical/j03wmx-shot-12519-observed-v1.json")
          summary = verify_compact_asset(
              asset,
              expected_sha256="d1b6dda14d84a266cd26ef607c12b62712fe906a8de9c9b75be860b464346db6",
          )
          assert summary["frame_count"] == 625
          assert summary["players_per_frame"] == 22
          assert summary["ball_xyz_frames"] == 625
          assert summary["exact_shot_aligned"]
          assert summary["public_replay_enabled"] is False
          PY
      - name: Commit ONLY deterministic CC BY 4.0 clip to review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/historical/j03wmx-shot-12519-observed-v1.json
          if git diff --cached --quiet; then
            echo "Reviewed static clip already exists at expected bytes"
            exit 0
          fi
          git commit -m "data(idsse): include source-verified CC BY 4.0 625-frame replay asset"
          git push origin "HEAD:refs/heads/feat/153-source-tracked-3d-replay"
