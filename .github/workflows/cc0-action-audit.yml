name: CC0 action pose audit (temporary)

on:
  push:
    branches: [feat/ui-cc0-action-pose-prop-safety-153]
    paths: [.github/workflows/cc0-action-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-official-poses:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: running
            slug: soccer-player-running-3d-person-team-sports-7293f9db
          - kind: kicking
            slug: soccer-player-kicking-3d-person-team-sports-bc15ef89
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Download original only from official CC0 page
        env:
          SLUG: ${{ matrix.slug }}
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cc0-${KIND}"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 150 --max-filesize 30000000 --silent --show-error \
            "https://www.innerscene.com/api/library/${SLUG}/download" \
            --output "${RUNNER_TEMP}/cc0-${KIND}/original.glb"
          test "$(head -c 4 "${RUNNER_TEMP}/cc0-${KIND}/original.glb")" = glTF
          sha256sum "${RUNNER_TEMP}/cc0-${KIND}/original.glb"
          wc -c "${RUNNER_TEMP}/cc0-${KIND}/original.glb"
      - name: Optimize with no external decoder requirement
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          npx --yes @gltf-transform/cli@4.5.1 optimize \
            "${RUNNER_TEMP}/cc0-${KIND}/original.glb" \
            "${RUNNER_TEMP}/cc0-${KIND}/optimized.glb" \
            --no-compress --texture-compress webp --texture-size 1024 \
            --simplify-ratio 0.65 --simplify-error 0.005
          node web/scripts/cc0-hero-inspect.mjs "${RUNNER_TEMP}/cc0-${KIND}/original.glb" "${RUNNER_TEMP}/cc0-${KIND}/optimized.glb"
      - name: Upload inspected optimized pose
        uses: actions/upload-artifact@v4
        with:
          name: verified-pose-${{ matrix.kind }}
          path: ${{ runner.temp }}/cc0-${{ matrix.kind }}/optimized.glb
          retention-days: 2
          if-no-files-found: error
