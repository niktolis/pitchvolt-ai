name: IDSSE original source validation

on:
  pull_request:
    paths:
      - '.github/workflows/idsse-source-verification.yml'
      - 'src/pitchvolt/idsse_frame_audit.py'
      - 'src/pitchvolt/idsse_source_audit.py'
      - 'tests/test_idsse_frame_audit.py'
      - 'src/pitchvolt/idsse_clip_export.py'
      - 'tests/test_idsse_clip_export.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idsse-original-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authentic-source:
    # Run this large, read-only original-data test once for its implementation
    # branch. After merge, operators can explicitly request it via Actions.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/150-idsse-source-backed-clip-export'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download ONLY the immutable, public DFL-licensed source match
        shell: bash
        run: |
          set -euo pipefail
          TARGET=local-data/idsse/J03WMX
          mkdir -p "$TARGET"
          for kind in metadata events tracking; do
            readarray -t pair < <(PYTHONPATH=src python - "$kind" <<'PY'
          import sys
          from pitchvolt.idsse_source_audit import SOURCE_NAMES, source_url
          kind = sys.argv[1]
          print(SOURCE_NAMES[kind])
          print(source_url(kind))
          PY
            )
            echo "Fetching pinned J03WMX $kind from publisher mirror"
            curl --fail --location --silent --show-error --max-time 1000 \
              --output "$TARGET/${pair[0]}" "${pair[1]}"
          done
      - name: Verify original SHA-256 and inspect genuine source frames
        shell: bash
        run: |
          set -euo pipefail
          TARGET=local-data/idsse/J03WMX
          META_SHA=$(sha256sum "$TARGET/DFL_02_01_matchinformation_DFL-COM-000001_DFL-MAT-J03WMX.xml" | cut -d' ' -f1)
          EVENT_SHA=$(sha256sum "$TARGET/DFL_03_02_events_raw_DFL-COM-000001_DFL-MAT-J03WMX.xml" | cut -d' ' -f1)
          PYTHONPATH=src python -m pitchvolt.idsse_frame_audit \
            --directory "$TARGET" \
            --metadata-sha256 "$META_SHA" \
            --events-sha256 "$EVENT_SHA" \
            --period 1 \
            --frame-count 625 \
            --shot-event-id 18226500000041 > idsse-audit-report.json
          python -m json.tool idsse-audit-report.json > /dev/null
          {
            echo "### IDSSE J03WMX original-source verification"
            echo ""
            echo "Source: DFL IDSSE/Sportec Open Data, CC BY 4.0."
            echo "Attribution: Deutsche Fußball Liga and Bassek et al. (2025), Scientific Data."
            echo ""
            echo '~~~json'
            cat idsse-audit-report.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ONLY aggregate audit (no raw tracking or derived trajectories)
        uses: actions/upload-artifact@v4
        with:
          name: idsse-j03wmx-authentic-coverage
          path: idsse-audit-report.json
          if-no-files-found: error
          retention-days: 3

      - name: Encode and verify source-observed 25-second replay asset
        shell: bash
        run: |
          set -euo pipefail
          TARGET=local-data/idsse/J03WMX
          OUTPUT=local-data/derived/j03wmx-shot-12519-observed-v1.json
          mkdir -p local-data/derived
          META_SHA=$(sha256sum "$TARGET/DFL_02_01_matchinformation_DFL-COM-000001_DFL-MAT-J03WMX.xml" | cut -d' ' -f1)
          EVENT_SHA=$(sha256sum "$TARGET/DFL_03_02_events_raw_DFL-COM-000001_DFL-MAT-J03WMX.xml" | cut -d' ' -f1)
          PYTHONPATH=src python -m pitchvolt.idsse_clip_export \
            --directory "$TARGET" \
            --metadata-sha256 "$META_SHA" \
            --events-sha256 "$EVENT_SHA" \
            --output "$OUTPUT" > idsse-export-report.json
          PYTHONPATH=src python - "$OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path
          from pitchvolt.idsse_clip_export import verify_compact_asset
          report = json.loads(Path("idsse-export-report.json").read_text())
          validated = verify_compact_asset(
              Path(sys.argv[1]), expected_sha256=report["asset_sha256"]
          )
          assert validated["exact_shot_aligned"]
          assert validated["ball_xyz_frames"] == 625
          assert validated["players_per_frame"] == 22
          print("Genuine original-source clip accepted:", report["asset_sha256"])
          PY
          {
            echo "### Source-observed replay asset"
            echo "Original J03WMX source verified at immutable revision."
            echo "No source movement extrapolated, padded or interpolated."
            echo "DFL/IDSSE — CC BY 4.0; Bassek et al (2025)."
            echo '~~~json'
            cat idsse-export-report.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compact observed 25-second clip (not original XML)
        uses: actions/upload-artifact@v4
        with:
          name: idsse-j03wmx-25s-observed-clip-v1
          path: |
            local-data/derived/j03wmx-shot-12519-observed-v1.json
            idsse-export-report.json
          if-no-files-found: error
          retention-days: 7
