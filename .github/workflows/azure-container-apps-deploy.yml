name: Deploy Azure Container App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pitchvolt-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10
        with:
          version: '0.10.0'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: test "$(node --version)" = "v$(cat .node-version)"
      - run: uv lock --check
      - run: uv sync --frozen --extra dev
      - run: npm ci --prefix web
      - run: uv run --frozen bash scripts/check.sh
      - run: uv run --frozen bash scripts/check-web.sh

  build-deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      # These are existing live Azure resource IDs; their legacy names are
      # intentionally NOT modified during the PitchVolt code/repository rename.
      AZURE_RG: rg-matchpulse-dev
      AZURE_ACR: matchpulsea433a4e04d
      AZURE_APP: matchpulse-web
      AZURE_REGISTRY_HOST: matchpulsea433a4e04d.azurecr.io
      PITCHVOLT_NARRATIVE_PROVIDER: local
    steps:
      - uses: actions/checkout@v7
      - name: Fail closed without approved identity configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID AZURE_CLIENT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository variable $name. Follow docs/github-azure-oidc.md."
              exit 1
            fi
          done
          [[ "$AZURE_SUBSCRIPTION_ID" == "98d4eb09-a320-4b90-aa9c-e561835357af" ]]
          [[ "$PITCHVOLT_NARRATIVE_PROVIDER" == "local" ]]
      - uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Validate existing infrastructure
        shell: bash
        run: |
          set -euo pipefail
          az containerapp show -g "$AZURE_RG" -n "$AZURE_APP" --query "name" -o tsv | grep -Fx "$AZURE_APP"
          az acr show -n "$AZURE_ACR" --query "loginServer" -o tsv | grep -Fx "$AZURE_REGISTRY_HOST"
      - uses: docker/setup-buildx-action@v4
      - name: Login to existing ACR with short-lived Azure identity
        run: az acr login --name "$AZURE_ACR"
      - name: Build AMD64 image and publish immutable digest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 \
            --file docker/backend.Dockerfile --target runtime \
            --build-arg "PITCHVOLT_BUILD_SHA=${GITHUB_SHA}" \
            --tag "$AZURE_REGISTRY_HOST/pitchvolt:git-${GITHUB_SHA}" \
            --metadata-file "$RUNNER_TEMP/pitchvolt-image.json" --push .
          digest=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/pitchvolt-image.json")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "IMAGE=$AZURE_REGISTRY_HOST/pitchvolt@$digest" >> "$GITHUB_ENV"
          echo "Published digest: $digest"
      - name: Update existing Container App only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE" == "$AZURE_REGISTRY_HOST/pitchvolt@sha256:"* ]]
          az containerapp update --resource-group "$AZURE_RG" --name "$AZURE_APP" \
            --image "$IMAGE" --min-replicas 0 --max-replicas 1 \
            --set-env-vars PITCHVOLT_NARRATIVE_PROVIDER=local --output none
      - name: Verify deployed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          fqdn=$(az containerapp show -g "$AZURE_RG" -n "$AZURE_APP" --query "properties.configuration.ingress.fqdn" -o tsv)
          [[ -n "$fqdn" ]]
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 15 "https://$fqdn/health"; then
              echo "Deployment health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Container App health check failed. Inspect revision; retain previous digest for rollback."
          exit 1

      - name: Wait for exact release on public domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            url="https://pitchvolt.app/?revision=${GITHUB_SHA}&probe=${attempt}"
            if curl --fail --silent --location --max-time 15 -H 'Cache-Control: no-cache' "$url" | grep -Fq "content=\"${GITHUB_SHA}\""; then
              echo "Verified pitchvolt.app serves ${GITHUB_SHA}"
              exit 0
            fi
            echo "Public site still on previous revision (attempt ${attempt}/36)"
            sleep 10
          done
          echo "::error::Public site did not converge to expected revision after 6 minutes"
          exit 1

