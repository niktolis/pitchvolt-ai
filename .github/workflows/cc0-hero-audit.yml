name: CC0 hero asset audit (feature branch only)

on:
  push:
    branches:
      - feat/142-cc0-real-footballer
    paths:
      - .github/workflows/cc0-hero-audit.yml
      - web/scripts/cc0-hero-inspect.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cc0-hero-asset-audit
  cancel-in-progress: true

jobs:
  inspect-official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Download only the official CC0 catalog GLB, bounded to 30 MB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pitchvolt-hero-audit"
          curl --fail --location --retry 2 --retry-delay 2 \
            --connect-timeout 15 --max-time 150 --max-filesize 30000000 \
            --silent --show-error \
            'https://www.innerscene.com/api/library/soccer-player-standing-3d-person-team-sports-f55b1b4f/download' \
            --output "${RUNNER_TEMP}/pitchvolt-hero-audit/original.glb"
          test "$(head -c 4 "${RUNNER_TEMP}/pitchvolt-hero-audit/original.glb")" = "glTF"
          echo "773cfa73bbcf659d7044934aaeacf1c3c9a49ae2955a51f56de7ad61ad1b6ffb  ${RUNNER_TEMP}/pitchvolt-hero-audit/original.glb" | sha256sum --check
          wc -c "${RUNNER_TEMP}/pitchvolt-hero-audit/original.glb"
      - name: Reproducibly optimize with fixed glTF Transform version and web textures
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @gltf-transform/cli@4.5.1 optimize \
            "${RUNNER_TEMP}/pitchvolt-hero-audit/original.glb" \
            "${RUNNER_TEMP}/pitchvolt-hero-audit/optimized.glb" \
            --no-compress --texture-compress webp --texture-size 1024 \
            --simplify-ratio 0.65 --simplify-error 0.005
      - name: Record actual binary hashes and materials, never guess origin/material names
        run: |
          node web/scripts/cc0-hero-inspect.mjs \
            "${RUNNER_TEMP}/pitchvolt-hero-audit/original.glb" \
            "${RUNNER_TEMP}/pitchvolt-hero-audit/optimized.glb"
      - name: Import only the exact audited optimized GLB into the feature branch
        shell: bash
        run: |
          set -euo pipefail
          echo "5bb8a63f2824d84c4f8a346ca11d6af0eefd1854050cfa3dde4fb12a134c6591  ${RUNNER_TEMP}/pitchvolt-hero-audit/optimized.glb" | sha256sum --check
          node web/scripts/import-hero-asset.mjs \
            --pose neutral \
            --source "${RUNNER_TEMP}/pitchvolt-hero-audit/original.glb" \
            --source-sha256 773cfa73bbcf659d7044934aaeacf1c3c9a49ae2955a51f56de7ad61ad1b6ffb \
            --source-url 'https://www.innerscene.com/tools/library/3d-parts/soccer-player-standing-3d-person-team-sports-f55b1b4f' \
            --optimized "${RUNNER_TEMP}/pitchvolt-hero-audit/optimized.glb" \
            --kit-material 'Micah | top' \
            --height-metres 1.84
          node web/scripts/check-hero-assets.mjs
          node --test web/scripts/hero-asset-audit.nodecheck.mjs
          git add web/src/assets/heroAssetManifest.json web/public/assets/hero
          git diff --cached --quiet && { echo "No new binary was imported" >&2; exit 1; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'feat(assets): import pinned optimized CC0 footballer hero'
          git push origin HEAD:feat/142-cc0-real-footballer
      - name: Upload optimized CC0 model for audit inspection
        uses: actions/upload-artifact@v4
        with:
          name: audited-cc0-soccer-player
          path: ${{ runner.temp }}/pitchvolt-hero-audit/optimized.glb
          retention-days: 3
          if-no-files-found: error
