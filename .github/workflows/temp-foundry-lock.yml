name: TEMP Generate Foundry optional lock
on:
  push:
    branches:
      - feat/foundry-optional-sdk-lock
permissions:
  contents: write
jobs:
  lock:
    if: "!contains(github.event.head_commit.message, '[lock-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
      - name: Resolve and validate optional dependencies
        run: |
          uv lock
          uv sync --frozen --extra dev --extra foundry
          uv run --frozen python -c "from agent_framework import Agent; from agent_framework.foundry import FoundryChatClient; from azure.identity import DefaultAzureCredential; print('Foundry SDK imports OK')"
          uv run --frozen pytest -q
      - name: Commit lockfile to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: resolve Foundry optional SDK dependencies [lock-generated]"
            git push origin HEAD:feat/foundry-optional-sdk-lock
          fi
