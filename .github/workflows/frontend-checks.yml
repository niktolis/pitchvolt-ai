name: Frontend checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10
        with:
          version: '0.10.0'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify latest stable Node runtime
        run: test "$(node --version)" = "v$(cat .node-version)"
      - name: Resolve official Node 26 slim image digest (temporary PR validation)
        run: docker buildx imagetools inspect node:26.10.0-bookworm-slim
      - name: Install exact backend dependencies
        run: uv sync --frozen --extra dev
      - name: Install exact frontend dependencies
        run: npm ci --prefix web
      - name: Run shared frontend checks
        run: uv run --frozen bash scripts/check-web.sh
      - name: Build frontend development container
        run: docker build --target web-development -f docker/backend.Dockerfile -t pitchvolt-web:test .
