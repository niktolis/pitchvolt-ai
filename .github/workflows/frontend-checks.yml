name: Frontend checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact backend dependencies
        run: uv sync --frozen --extra dev
      - name: Install exact frontend dependencies
        run: npm ci --prefix web
      - name: Run shared frontend checks
        run: uv run --frozen bash scripts/check-web.sh
      - name: Diagnose public PitchVolt DNS and HTTPS reachability (non-billable)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== System DNS resolution ==="
          getent ahosts pitchvolt.app || true
          echo "=== DNS via Cloudflare and Google public DNS-over-HTTPS ==="
          for endpoint in "https://cloudflare-dns.com/dns-query?name=pitchvolt.app&type=A" "https://dns.google/resolve?name=pitchvolt.app&type=A"; do
            curl -fSL --retry 1 --max-time 12 -H "accept: application/dns-json" "$endpoint" || true
            echo
          done
          echo "=== Public GET / and GET /health, HTTP headers and browser-like body ==="
          for url in "https://pitchvolt.app/" "https://pitchvolt.app/health"; do
            echo "--- $url"
            curl -4 -sSL --connect-timeout 8 --max-time 20 \
              -D /tmp/pitchvolt-response-headers \
              -o /tmp/pitchvolt-response-body \
              -w 'http_code=%{http_code} remote_ip=%{remote_ip} ssl_verify=%{ssl_verify_result} size=%{size_download}\\n' \
              "$url" || true
            cat /tmp/pitchvolt-response-headers || true
            head -c 500 /tmp/pitchvolt-response-body || true
            echo
          done
          echo "=== Validate GET homepage and health (must both be 2xx) ==="
          curl -4 -fsSL --connect-timeout 8 --max-time 20 https://pitchvolt.app/health
          curl -4 -fsSL --connect-timeout 8 --max-time 20 https://pitchvolt.app/ | grep -F "PitchVolt AI"
      - name: Build frontend development container
        run: docker build --target web-development -f docker/backend.Dockerfile -t pitchvolt-web:test .
