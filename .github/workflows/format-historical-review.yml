name: Format historical replay review files

on:
  push:
    branches:
      - feat/153-source-tracked-3d-replay
    paths:
      - .github/workflows/format-historical-review.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'niktolis/pitchvolt-ai' && github.ref == 'refs/heads/feat/153-source-tracked-3d-replay'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Format and lint exact new replay files
        working-directory: web
        run: |
          npx biome check --write \
            src/components/HistoricalReplay.tsx \
            src/components/HistoricalTrackingScene.tsx \
            src/domain/historicalReplay.ts \
            src/domain/historicalReplay.test.ts
      - name: Commit formatting to review branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/HistoricalReplay.tsx \
            web/src/components/HistoricalTrackingScene.tsx \
            web/src/domain/historicalReplay.ts \
            web/src/domain/historicalReplay.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(ui): apply pinned Biome to historical replay"
          git push origin "HEAD:refs/heads/feat/153-source-tracked-3d-replay"
