name: Python checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - name: Validate lockfile and install exact dependencies
        run: |
          uv lock --check
          uv sync --frozen --extra dev
      - name: Run shared checks
        run: uv run --frozen bash scripts/check.sh
      - name: Build and test development container
        run: |
          docker compose build backend
          docker compose run --rm backend bash scripts/check.sh
      - name: Build production-stage image
        run: docker build --target runtime -f docker/backend.Dockerfile -t matchpulse-runtime:test .
      - name: Run production-stage HTTP and UI smoke test
        run: |
          docker run -d --name matchpulse-test -p 8000:8000 matchpulse-runtime:test
          trap 'docker rm -f matchpulse-test || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://localhost:8000/health; then
              curl --fail --silent http://localhost:8000/ | grep -q 'MatchPulse AI'
              exit 0
            fi
            sleep 1
          done
          docker logs matchpulse-test
          exit 1
