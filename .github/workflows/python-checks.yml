name: Python checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: bash scripts/check.sh
      - name: Build and test development container
        run: |
          docker compose build backend
          docker compose run --rm backend bash scripts/check.sh
      - name: Build production-stage image
        run: docker build --target runtime -f docker/backend.Dockerfile -t matchpulse-runtime:test .
      - name: Run production-stage smoke test
        run: docker run --rm matchpulse-runtime:test
