name: Generate API dependency lock (one-time)
on:
  push:
    branches: [feat/realtime-match-api]
    paths:
      - 'pyproject.toml'
      - '.github/workflows/api-lock-bootstrap.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/realtime-match-api
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - run: uv lock --python 3.12
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m 'build: lock API dependencies'
            git fetch origin feat/realtime-match-api
            git rebase origin/feat/realtime-match-api
            git push origin HEAD:feat/realtime-match-api
          fi
