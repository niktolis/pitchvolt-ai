name: Import audited CC0 action poses (temporary)

on:
  push:
    branches: [feat/ui-cc0-action-pose-prop-safety-153]
    paths: [.github/workflows/cc0-pose-import.yml]

permissions:
  contents: write

jobs:
  import-three-poses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify source-pinned standing, running and kicking, strip unsourced props, import
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cc0"
          while read -r pose slug original_hash optimized_hash; do
            directory="${RUNNER_TEMP}/cc0/${pose}"
            mkdir -p "${directory}"
            curl --fail --location --retry 2 --connect-timeout 15 --max-time 150 --max-filesize 30000000 --silent --show-error \
              "https://www.innerscene.com/api/library/${slug}/download" \
              --output "${directory}/source.glb"
            echo "${original_hash}  ${directory}/source.glb" | sha256sum --check

            npx --yes @gltf-transform/cli@4.5.1 optimize \
              "${directory}/source.glb" "${directory}/optimized.glb" \
              --no-compress --texture-compress webp --texture-size 1024 \
              --simplify-ratio 0.65 --simplify-error 0.005
            echo "${optimized_hash}  ${directory}/optimized.glb" | sha256sum --check

            node web/scripts/strip-hero-props.mjs "${directory}/optimized.glb" "${directory}/sanitized.glb"
            node web/scripts/import-hero-asset.mjs \
              --pose "${pose}" \
              --source "${directory}/source.glb" \
              --source-sha256 "${original_hash}" \
              --source-url "https://www.innerscene.com/tools/library/3d-parts/${slug}" \
              --optimized "${directory}/sanitized.glb" \
              --kit-material 'Micah | top' \
              --height-metres 1.84
          done <<'PINS'
          neutral soccer-player-standing-3d-person-team-sports-f55b1b4f 773cfa73bbcf659d7044934aaeacf1c3c9a49ae2955a51f56de7ad61ad1b6ffb 5bb8a63f2824d84c4f8a346ca11d6af0eefd1854050cfa3dde4fb12a134c6591
          stride soccer-player-running-3d-person-team-sports-7293f9db 450f18f276d7be1a1b4e314ca928d4e6bdb68fdd0bb771c8a91a0cead5e2005a ebbed8336c2e12a50cfb9f69357a2e36a74c06b3c8b1666b289cbed8496ae161
          strike soccer-player-kicking-3d-person-team-sports-bc15ef89 37aff382d98f0742124e871115df388286d7506cf0192eb798b93a11ddeee739 9ddfee44a2fd0a243c583064adde5d448c1bd7aa33e22aacc199ed97e87ff721
          PINS
          rm web/public/assets/hero/neutral-5bb8a63f2824d84c.glb
          node web/scripts/check-hero-assets.mjs
          node --test web/scripts/strip-hero-props.nodecheck.mjs
          git add web/src/assets/heroAssetManifest.json web/public/assets/hero
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'feat(ui): import verified same-character action GLBs with stripped unsourced props'
          git push origin HEAD:feat/ui-cc0-action-pose-prop-safety-153
