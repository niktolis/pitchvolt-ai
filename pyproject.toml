[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "matchpulse-ai"
version = "0.1.0"
description = "Deterministic synthetic football event intelligence"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "httpx>=0.28,<1"]
foundry = ["agent-framework-foundry>=1.15,<2", "azure-identity>=1.17,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/matchpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
